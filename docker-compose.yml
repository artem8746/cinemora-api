services:
  postgres:
    image: postgres:13
    container_name: cinemora-api-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cinemora-network

  redis:
    image: redis:6
    container_name: cinemora-api-redis
    env_file:
      - .env
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
    networks:
      - cinemora-network

networks:
  cinemora-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

